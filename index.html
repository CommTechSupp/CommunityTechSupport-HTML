```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>DIY AI Academy App</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#f4f8ff;
  color:#0f172a;
  overflow-x:hidden;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:white;
  border-bottom:1px solid #dbeafe;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#2563eb;
}

.profile{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* HERO */

.hero{
  padding:40px 20px;
  background:linear-gradient(135deg,#1d4ed8,#2563eb,#60a5fa);
  color:white;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  opacity:0.9;
  max-width:600px;
}

/* STATS */

.stats{
  display:flex;
  gap:15px;
  margin-top:25px;
  flex-wrap:wrap;
}

.stat{
  background:rgba(255,255,255,0.15);
  padding:15px 20px;
  border-radius:16px;
  min-width:120px;
  backdrop-filter:blur(5px);
}

.stat h2{
  font-size:28px;
}

/* SEARCH */

.search-wrap{
  padding:20px;
}

.search{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  background:white;
  font-size:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.06);
  outline:none;
}

/* CATEGORY */

.categories{
  display:flex;
  gap:10px;
  padding:0 20px;
  overflow:auto;
}

.cat{
  white-space:nowrap;
  background:white;
  padding:10px 18px;
  border-radius:999px;
  cursor:pointer;
  font-weight:600;
  border:1px solid #dbeafe;
  transition:0.3s;
}

.cat.active{
  background:#2563eb;
  color:white;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  padding:20px;
}

/* CARD */

.card{
  background:white;
  border-radius:22px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.card:hover{
  transform:translateY(-6px);
}

.thumb{
  width:100%;
  height:190px;
  object-fit:cover;
}

.card-body{
  padding:16px;
}

.card-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:6px;
}

.card-desc{
  color:#64748b;
  font-size:14px;
  margin-bottom:12px;
}

.meta{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#64748b;
}

/* AI */

.ai-box{
  margin:20px;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

.ai-box h2{
  margin-bottom:12px;
}

textarea{
  width:100%;
  border:none;
  background:#f1f5f9;
  border-radius:14px;
  padding:14px;
  resize:none;
  min-height:100px;
  margin-top:10px;
  outline:none;
}

button{
  width:100%;
  border:none;
  background:#2563eb;
  color:white;
  padding:14px;
  border-radius:14px;
  margin-top:12px;
  cursor:pointer;
  font-weight:700;
  transition:0.3s;
}

button:hover{
  background:#1d4ed8;
}

.ai-output{
  margin-top:15px;
  background:#eff6ff;
  padding:15px;
  border-radius:14px;
  min-height:80px;
  line-height:1.6;
}

/* COMMUNITY */

.community{
  margin:20px;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

.post{
  background:#eff6ff;
  padding:12px;
  border-radius:12px;
  margin-top:12px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  padding:20px;
}

.modal-content{
  width:100%;
  max-width:950px;
  background:white;
  border-radius:24px;
  overflow:hidden;
  position:relative;
}

iframe{
  width:100%;
  height:520px;
  border:none;
}

.close{
  position:absolute;
  top:15px;
  right:18px;
  color:white;
  background:red;
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-weight:bold;
  z-index:100;
}

/* MOBILE */

@media(max-width:700px){

  .hero h1{
    font-size:28px;
  }

  iframe{
    height:260px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    DIY AI Academy
  </div>

  <div class="profile">
    AI
  </div>

</header>

<!-- HERO -->

<div class="hero">

  <h1>Learn Skills With AI</h1>

  <p>
    Watch tutorials, ask AI questions,
    and learn cybersecurity safely.
  </p>

  <div class="stats">

    <div class="stat">
      <h2 id="xp">0</h2>
      <span>XP</span>
    </div>

    <div class="stat">
      <h2 id="level">1</h2>
      <span>Level</span>
    </div>

    <div class="stat">
      <h2 id="watched">0</h2>
      <span>Watched</span>
    </div>

  </div>

</div>

<!-- SEARCH -->

<div class="search-wrap">

  <input
    class="search"
    id="search"
    placeholder="Search tutorials..."
    oninput="render()"
  >

</div>

<!-- CATEGORIES -->

<div class="categories" id="cats"></div>

<!-- VIDEOS -->

<div class="grid" id="list"></div>

<!-- AI -->

<div class="ai-box">

  <h2>🤖 AI Assistant</h2>

  <textarea
    id="q"
    placeholder="Ask AI anything..."
  ></textarea>

  <button onclick="askAI()">
    Ask AI
  </button>

  <div class="ai-output" id="out">
    AI ready to help you.
  </div>

</div>

<!-- COMMUNITY -->

<div class="community">

  <h2>💬 Community Feed</h2>

  <textarea
    id="msg"
    placeholder="Share your experience..."
  ></textarea>

  <button onclick="addPost()">
    Post Message
  </button>

  <div id="posts"></div>

</div>

<!-- VIDEO MODAL -->

<div class="modal" id="modal">

  <div class="modal-content">

    <div class="close" onclick="closeVideo()">
      ✕
    </div>

    <iframe
      id="video"
      allowfullscreen
    ></iframe>

  </div>

</div>

<script>

/* DATA */

const videos = [

{
title:"Fix Phone Screen",
desc:"Repair cracked smartphone screens.",
cat:"Phone",
views:"1.2K",
id:"6Maq5IyHSuc",
img:"https://img.youtube.com/vi/6Maq5IyHSuc/hqdefault.jpg"
},

{
title:"Build Gaming PC",
desc:"Full gaming PC build tutorial.",
cat:"PC",
views:"5.2K",
id:"PXaLc9AYIcg",
img:"https://img.youtube.com/vi/PXaLc9AYIcg/hqdefault.jpg"
},

{
title:"Install SSD",
desc:"Upgrade laptop speed instantly.",
cat:"Laptop",
views:"2.4K",
id:"5NckCxoxobE",
img:"https://img.youtube.com/vi/5NckCxoxobE/hqdefault.jpg"
},

{
title:"Phishing Awareness",
desc:"Learn how to detect online scams safely.",
cat:"Cybersecurity",
views:"9.1K",
id:"Y7zNlEMDmI4",
img:"https://img.youtube.com/vi/Y7zNlEMDmI4/hqdefault.jpg"
}

];

/* VARIABLES */

let current = "All";

let xp = 0;
let level = 1;
let watched = 0;

const categories = [
"All",
...new Set(videos.map(v=>v.cat))
];

/* LOAD CATEGORIES */

function loadCats(){

document.getElementById("cats").innerHTML =
categories.map(c=>`

<div
class="cat ${current===c?'active':''}"
onclick="setCat('${c}')"
>
${c}
</div>

`).join('');

}

function setCat(c){

current = c;

loadCats();

render();

}

/* RENDER */

function render(){

const q =
document.getElementById("search")
.value
.toLowerCase();

const filtered =
videos.filter(v=>

(current==="All"||v.cat===current)

&&

v.title.toLowerCase().includes(q)

);

document.getElementById("list").innerHTML =

filtered.map(v=>`

<div class="card" onclick="play('${v.id}')">

<img class="thumb" src="${v.img}">

<div class="card-body">

<div class="card-title">
${v.title}
</div>

<div class="card-desc">
${v.desc}
</div>

<div class="meta">
<span>${v.cat}</span>
<span>${v.views} views</span>
</div>

</div>

</div>

`).join('');

}

/* PLAY VIDEO */

function play(id){

document.getElementById("modal").style.display="flex";

document.getElementById("video").src =
"https://www.youtube.com/embed/"+id+"?autoplay=1";

xp += 10;
watched++;

if(xp >= level * 50){

level++;

alert("🎉 Level Up!");

}

updateStats();

}

/* CLOSE */

function closeVideo(){

document.getElementById("modal").style.display="none";

document.getElementById("video").src="";

}

/* STATS */

function updateStats(){

document.getElementById("xp").innerText = xp;

document.getElementById("level").innerText = level;

document.getElementById("watched").innerText = watched;

}

/* AI */

function askAI(){

let q =
document.getElementById("q")
.value
.toLowerCase();

let out =
document.getElementById("out");

if(!q){

out.innerText =
"Please ask a question.";

return;

}

const responses = [

"Try restarting the device and checking all cables.",

"Breaking the issue into smaller steps helps troubleshooting.",

"Updating drivers and software fixes many problems.",

"Check internet connection and restart the router.",

"Using SSD storage improves speed dramatically."

];

if(q.includes("wifi")){

out.innerText =
"Move the router to open space and restart it.";

}

else if(q.includes("pc")){

out.innerText =
"Use SSD + 16GB RAM + proper cooling.";

}

else if(q.includes("phone")){

out.innerText =
"Restart device and inspect screen or battery health.";

}

else if(q.includes("phishing")||q.includes("scam")){

out.innerText =
"Never click suspicious links and verify sender emails carefully.";

}

else{

out.innerText =
responses[Math.floor(Math.random()*responses.length)];

}

}

/* COMMUNITY */

let posts = [];

function addPost(){

let msg =
document.getElementById("msg").value;

if(!msg)return;

posts.unshift(msg);

document.getElementById("msg").value="";

document.getElementById("posts").innerHTML =

posts.map(p=>`

<div class="post">
${p}
</div>

`).join('');

}

/* INIT */

loadCats();

render();

updateStats();

</script>

</body>
</html>
```
