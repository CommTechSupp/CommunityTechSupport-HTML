<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>

*,*::before,*::after{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--white:#ffffff;
--off:#f7f9fc;
--blue50:#eff6ff;
--blue100:#dbeafe;
--blue200:#bfdbfe;
--blue300:#93c5fd;
--blue400:#60a5fa;
--blue500:#3b82f6;
--blue600:#2563eb;
--blue700:#1d4ed8;
--slate100:#f1f5f9;
--slate200:#e2e8f0;
--slate300:#cbd5e1;
--slate400:#94a3b8;
--slate500:#64748b;
--slate600:#475569;
--slate700:#334155;
--slate800:#1e293b;
--slate900:#0f172a;

--radius-sm:10px;
--radius-md:16px;
--radius-lg:24px;
--radius-xl:32px;
--radius-full:9999px;

--shadow-sm:0 2px 8px rgba(0,0,0,.05);
--shadow-md:0 10px 30px rgba(37,99,235,.08);

.page{

/* NAV */

.nav{
position:fixed;
top:0;
left:0;
right:0;
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 24px;
background:rgba(255,255,255,.8);

border-bottom:1px solid rgba(255,255,255,.9);

}

.nav-logo{
font-family:'Syne',sans-serif;
font-size:1.7rem;
font-weight:800;
background:var(--grad-primary);

}

.nav-actions{
display:flex;
gap:10px;
align-items:center;
}

.nav-link{
border:none;
background:none;
cursor:pointer;
padding:10px 16px;
border-radius:999px;
font-size:.9rem;
font-weight:600;

}

.nav-link:hover{

/* BUTTONS */

.btn{

.hero-sub{

line-height:1.8;

justify-content:center;

.hero-stats{

.section-title{

.filter-select{

.avatar{

height:64px;

background:var(--blue100);

align-items:center;

.avatar img{

.card-meta{

.profile-name{

.profile-spec{

/* TOAST */

.toast{

@media(max-width:768px){

.form-row{

}

}

.hero-stats{
gap:30px;
}

}

</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const {useState,useEffect,useCallback}=React;

/* STORAGE */

const LS={
get:(k,f=null)=>{
try{
const v=localStorage.getItem(k);
return v ? JSON.parse(v) : f;
}catch{
return f;
}
},
set:(k,v)=>{
localStorage.setItem(k,JSON.stringify(v));
},
rm:(k)=>{
localStorage.removeItem(k);
}
};

/* UTIL */

const initials=name=>
name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

const compressImage=(file,callback)=>{

const reader=new FileReader();

reader.onload=(event)=>{

const img=new Image();

img.onload=()=>{

const canvas=document.createElement('canvas');

const MAX=300;

let width=img.width;
let height=img.height;

if(width>height){

if(width>MAX){
height*=MAX/width;
width=MAX;
}

}else{

if(height>MAX){
width*=MAX/height;
height=MAX;
}

}

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext('2d');

ctx.drawImage(img,0,0,width,height);

const compressed=canvas.toDataURL('image/jpeg',0.7);

callback(compressed);

};

img.src=event.target.result;

};

reader.readAsDataURL(file);

};

/* SPECIALTIES */

const SPECIALTIES=[
'Electrician',
'Plumber',
'HVAC Tech',
'Carpenter',
'Painter',
'Welder',
'Auto Mechanic',
'IT Support',
'Solar Installer',
'Security System',
'General Handyman',
'Appliance Repair'
];

/* DEFAULT TECHS */

const defaultTechs=[
{
id:'t1',
name:'Marcus Webb',
specialty:'Electrician',
location:'New York, NY',
rating:'4.9',
jobs:'142',
experience:'8 years',
bio:'Licensed master electrician with expertise in residential and commercial systems.',
availability:'available',
linkedin:'',
photo:''
},
{
id:'t2',
name:'Priya Nair',
specialty:'Plumber',
location:'Brooklyn, NY',
rating:'4.8',
jobs:'98',
experience:'6 years',
bio:'Specializing in emergency plumbing repair and installations.',
availability:'busy',
linkedin:'',
photo:''
}
];

/* TOAST */

function Toast({msg,onClose}){

useEffect(()=>{
const t=setTimeout(onClose,3000);
return()=>clearTimeout(t);
},[]);

return <div className="toast">{msg}</div>;

}

/* NAV */

function Nav({setPage,user,onLogout}){

return(
<nav className="nav">

<div className="nav-logo" onClick={()=>setPage('home')}>
FixIt
</div>

<div className="nav-actions">

<button className="nav-link" onClick={()=>setPage('home')}>
Marketplace
</button>

{user ? (
<>
<button className="nav-link" onClick={()=>setPage('dashboard')}>
Dashboard
</button>

<button className="btn btn-danger btn-sm" onClick={onLogout}>
Logout
</button>
</>
):(
<>
<button className="nav-link" onClick={()=>setPage('login')}>
Login
</button>

<button className="btn btn-primary btn-sm" onClick={()=>setPage('signup')}>
Sign Up
</button>
</>
)}

</div>

</nav>
);

}

/* AVATAR */

function Avatar({photo,name,size=64}){

return(
<div className="avatar" style={{width:size,height:size}}>
{photo
? <img src={photo}/>
: initials(name)}
</div>
);

}

/* TECH CARD */

function TechCard({tech,onHire}){

return(
<div className="tech-card">

<div className="card-header">

<Avatar photo={tech.photo} name={tech.name}/>

<div>

<div className="card-name">
{tech.name}
</div>

<div className="card-specialty">
{tech.specialty}
</div>

<div style={{marginTop:8,color:'#f59e0b',fontWeight:700}}>
★ {tech.rating}
</div>

</div>

</div>

<div className="card-meta">

<div className="meta-badge">
📍 {tech.location}
</div>

<div className="meta-badge">
⚡ {tech.experience}
</div>

<div className="meta-badge">
✓ {tech.jobs} jobs
</div>

</div>

<div className="card-bio">
{tech.bio}
</div>

<div className="card-actions">

{tech.linkedin && (
<a
href={tech.linkedin}
target="_blank"
className="btn btn-ghost"
style={{textDecoration:'none'}}
>
LinkedIn
</a>
)}

<button
className="btn btn-primary"
onClick={()=>onHire(tech)}
>
Hire Now
</button>

</div>

</div>
);

}

/* ADD TECH MODAL */

function AddTechModal({onClose,onAdd}){

const [form,setForm]=useState({
name:'',
specialty:SPECIALTIES[0],
location:'',
rating:'5.0',
jobs:'0',
experience:'1 year',
bio:'',
linkedin:'',
photo:'',
availability:'available'
});

const set=k=>e=>
setForm(f=>({...f,[k]:e.target.value}));

const handlePhoto=e=>{

const file=e.target.files[0];

if(!file)return;

compressImage(file,(compressed)=>{
setForm(f=>({...f,photo:compressed}));
});

};

const submit=()=>{

if(!form.name || !form.location)return;

onAdd({
...form,
id:'t_'+Date.now()
});

onClose();

};

return(
<div className="overlay">

<div className="modal">

<div className="modal-title">
Add Technician
</div>

<div className="modal-sub">
List a new technician on the marketplace
</div>

<div className="upload">

<input type="file" accept="image/*" onChange={handlePhoto}/>

{form.photo
? <img src={form.photo}/>
: <div>📷 Upload Photo</div>}

</div>

<div className="form-row">

<div className="form-group">
<label className="form-label">Full Name</label>

<input
className="form-input"
value={form.name}
onChange={set('name')}
/>
</div>

<div className="form-group">
<label className="form-label">Specialty</label>

<select
className="form-select"
value={form.specialty}
onChange={set('specialty')}
>
{SPECIALTIES.map(s=>
<option key={s}>{s}</option>
)}
</select>
</div>

</div>

<div className="form-row">

<div className="form-group">
<label className="form-label">Location</label>

<input
className="form-input"
value={form.location}
onChange={set('location')}
/>
</div>

<div className="form-group">
<label className="form-label">Experience</label>

<input
className="form-input"
value={form.experience}
onChange={set('experience')}
/>
</div>

</div>

<div className="form-group">
<label className="form-label">Bio</label>

<textarea
className="form-textarea"
value={form.bio}
onChange={set('bio')}
></textarea>
</div>

<div className="form-actions">

<button className="btn btn-ghost" onClick={onClose}>
Cancel
</button>

<button className="btn btn-primary" onClick={submit}>
Add Technician
</button>

</div>

</div>

</div>
);

}

/* HIRE MODAL */

function HireModal({tech,onClose}){

const [name,setName]=useState('');
const [message,setMessage]=useState('');
const [sent,setSent]=useState(false);

if(sent){

return(
<div className="overlay">

<div className="overlay">

<div className="modal">

</div>

<div className="modal-sub">
{tech.specialty}
</div>

<div className="form-group">

<label className="form-label">

<input

<div className="form-group">

<label className="form-label">

<textarea
className="form-textarea"
value={message}

></textarea>

</div>

<div className="form-actions">

<button className="btn btn-ghost" onClick={onClose}>
Cancel
</button>

<button
className="btn btn-primary"
onClick={()=>setSent(true)}
>
Send Request
</button>

</div>

</div>

</div>
);

}

/* HOME */

function HomePage({user,setPage,showToast}){

const [techs,setTechs]=useState(()=>{
return LS.get('fixit_techs',defaultTechs);
});

const [search,setSearch]=useState('');
const [filter,setFilter]=useState('All');
const [showAdd,setShowAdd]=useState(false);
const [hireTech,setHireTech]=useState(null);

useEffect(()=>{
LS.set('fixit_techs',techs);
},[techs]);

const filtered=techs.filter(t=>{

const q=search.toLowerCase();

const match=
t.name.toLowerCase().includes(q) ||
t.specialty.toLowerCase().includes(q) ||
t.location.toLowerCase().includes(q);

const matchFilter=
filter==='All' || t.specialty===filter;

return match && matchFilter;

});

const addTech=tech=>{

setTechs(prev=>[tech,...prev]);

showToast('Technician added');

};

return(
<div className="page">

<section className="hero">

<h1 className="hero-title">
Find Expert <br/>
<span>Technicians</span>
</h1>

<p className="hero-sub">
Connect with trusted professionals for repairs,

/* LOGIN */

function LoginPage({setPage,onLogin,showToast}){

const [email,setEmail]=useState('');
const [password,setPassword]=useState('');

const submit=()=>{

const users=LS.get('fixit_users',[]);

const found=users.find(
u=>u.email===email && u.password===password
);

if(!found){
showToast('Invalid credentials');
return;
}

LS.set('fixit_current_user',found);

onLogin(found);

};

return(
<div className="auth-page">

<div className="auth-card">

<div className="auth-logo">
FixIt
</div>

<div className="auth-title">
Welcome Back
</div>

<div className="auth-sub">

</div>

Email
</label>

className="form-input"
type="email"
value={email}
onChange={e=>setEmail(e.target.value)}
/>

</div>

<div className="form-group">

<label className="form-label">
Password
</label>

<input
className="form-input"
type="password"
value={password}
onChange={e=>setPassword(e.target.value)}
/>

className="btn btn-primary"
style={{width:'100%'}}

No account?

 Create one
</span>
</div>

</div>

</div>
);

}

/* SIGNUP */

function SignupPage({setPage,onLogin,showToast}){

const [form,setForm]=useState({
name:'',
email:'',
location:'',
specialty:SPECIALTIES[0],
password:'',
confirm:''
});

const set=k=>e=>
setForm(f=>({...f,[k]:e.target.value}));

const submit=()=>{

if(
!form.name ||
!form.email ||
!form.location ||
!form.password
){
showToast('Please fill all fields');
return;
}

if(form.password!==form.confirm){
showToast('Passwords do not match');
return;
}

const users=LS.get('fixit_users',[]);

if(users.find(u=>u.email===form.email)){
showToast('Email already exists');
return;
}

const user={
id:'u_'+Date.now(),
name:form.name,
email:form.email,
location:form.location,
specialty:form.specialty,
password:form.password,
photo:'',
bio:'',
experience:'1 year',
jobs:'0',
rating:'5.0',
availability:'available',
createdAt:Date.now()
};

LS.set('fixit_users',[...users,user]);

const techs=LS.get('fixit_techs',defaultTechs);

LS.set('fixit_techs',[user,...techs]);

LS.set('fixit_current_user',user);

onLogin(user);

};

return(
<div className="auth-page">

<div className="auth-card">

<div className="auth-logo">
FixIt
</div>

<div className="auth-title">
Create Account
</div>

<div className="auth-sub">
Join the marketplace
</div>

<div className="form-group">

<label className="form-label">
Full Name
</label>

<input
className="form-input"
value={form.name}
onChange={set('name')}
/>

</div>

<div className="form-group">

<label className="form-label">
Email
</label>

<input
className="form-input"
type="email"
value={form.email}
onChange={set('email')}
/>

</div>

<div className="form-group">

<label className="form-label">
Location
</label>

<input
className="form-input"
value={form.location}
onChange={set('location')}
/>

</div>

<div className="form-group">

<label className="form-label">
Specialty
</label>

<select
className="form-select"
value={form.specialty}
onChange={set('specialty')}
>

{SPECIALTIES.map(s=>
<option key={s}>{s}</option>
)}

</select>

</div>

<div className="form-row">

<div className="form-group">

<label className="form-label">
Password
</label>

<input
className="form-input"
type="password"
value={form.password}
onChange={set('password')}
/>

</div>

<div className="form-group">

<label className="form-label">
Confirm
</label>

<input
className="form-input"
type="password"
value={form.confirm}
onChange={set('confirm')}
/>

</div>

</div>

<button
className="btn btn-primary"
style={{width:'100%'}}
onClick={submit}
>
Create Account
</button>

<div className="auth-switch">
Already have an account?
<span onClick={()=>setPage('login')}>
 Sign In
</span>
</div>

</div>

</div>
);

}

/* DASHBOARD */

function DashboardPage({user,setUser,showToast}){

const [profile,setProfile]=useState({...user});

const set=k=>e=>
setProfile(p=>({...p,[k]:e.target.value}));

const handlePhoto=e=>{

const file=e.target.files[0];

if(!file)return;

compressImage(file,(compressed)=>{

setProfile(p=>({
...p,
photo:compressed
}));

});

};

const save=()=>{

const users=LS.get('fixit_users',[]);

const updatedUsers=users.map(u=>
u.id===profile.id ? {...u,...profile} : u
);

LS.set('fixit_users',updatedUsers);

LS.set('fixit_current_user',profile);

const techs=LS.get('fixit_techs',[]);

const updatedTechs=techs.map(t=>
t.id===profile.id ? {...t,...profile} : t
);

LS.set('fixit_techs',updatedTechs);

setUser(profile);

showToast('Profile saved');

};

return(
<div className="page">

<div className="dashboard">

<div className="dash-header">

<div>
<div className="dash-title">
Hey, {profile.name.split(' ')[0]} 👋
</div>

<div style={{marginTop:6,color:'var(--slate400)'}}>
Manage your technician profile
</div>

<button className="btn btn-primary" onClick={save}>

</button>

</div>

<div className="dash-grid">

<div>

<div className="profile-card">

<div className="profile-avatar">

{profile.photo
? <img src={profile.photo}/>
: initials(profile.name)}

<input
type="file"
accept="image/*"
onChange={handlePhoto}
/>

</div>

<div className="profile-name">
{profile.name}
</div>

<div className="profile-spec">
{profile.specialty}
</div>

<p style={{
marginTop:18,
fontSize:'.9rem',
lineHeight:1.7,
color:'var(--slate500)'
}}>
{profile.bio || 'No bio yet'}
</p>

</div>

</div>

<div>

<div className="dash-card">

<div className="dash-card-title">
Profile Information
</div>

<div className="form-row">

<div className="form-group">

<label className="form-label">
Full Name
</label>

<input
className="form-input"
value={profile.name}
onChange={set('name')}
/>

</div>

<div className="form-group">

<label className="form-label">
Specialty
</label>

<select
className="form-select"
value={profile.specialty}
onChange={set('specialty')}
>

{SPECIALTIES.map(s=>
<option key={s}>{s}</option>
)}

</select>

</div>

</div>

<div className="form-group">

Location
</label>

<input
className="form-input"

onChange={set('location')}
/>

</div>

<div className="form-group">

Experience
</label>

<input
className="form-input"

/>

</div>

<div className="form-group">

<label className="form-label">
LinkedIn
</label>

<input

/* APP */

function App(){

const [page,setPage]=useState('home');

const [user,setUser]=useState(
LS.get('fixit_current_user')
);

const [toast,setToast]=useState(null);

const showToast=msg=>{
setToast(msg);
};

const logout=()=>{

LS.rm('fixit_current_user');

setUser(null);

setPage('home');

showToast('Logged out');

};

return(
<>

<Nav
setPage={setPage}
user={user}
onLogout={logout}
/>

{page==='home' && (
<HomePage
user={user}
setPage={setPage}
showToast={showToast}
/>
)}

{page==='login' && (
<LoginPage
setPage={setPage}
onLogin={u=>{
setUser(u);
setPage('dashboard');
}}
showToast={showToast}
/>
)}

{page==='signup' && (
<SignupPage
setPage={setPage}
onLogin={u=>{
setUser(u);
setPage('dashboard');
}}
showToast={showToast}
/>
)}

{page==='dashboard' && user && (
<DashboardPage
user={user}
setUser={setUser}
showToast={showToast}
/>
)}

{toast && (
<Toast
msg={toast}
onClose={()=>setToast(null)}
/>
)}

</>
);

}

ReactDOM.createRoot(
document.getElementById('root')
).render(<App/>);

</script>
